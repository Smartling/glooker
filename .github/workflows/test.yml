name: Tests
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

# Least privilege for the whole workflow. This job only reads the repo; it
# never pushes, comments, or publishes. Without this block the job inherits
# the repository default, which on many orgs is still read/write on all
# scopes — and this workflow builds untrusted pull-request code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Do not leave the job token in .git/config. This workflow runs
          # pull-request code (npm lifecycle scripts, tests, next build), so a
          # persisted credential is readable by anything that code invokes.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Detect invisible Unicode in prompts
        # Mirror the runtime stripInvisible() character set so the CI gate
        # and the runtime sanitizer agree. \x{0009}(tab), \x{000A}(LF),
        # \x{000D}(CR) are intentionally excluded — they legitimately appear
        # in prompt files.
        run: |
          if perl -CSD -ne 'exit 1 if /[\x{E0020}-\x{E007F}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}\x{FEFF}\x{0001}-\x{0008}\x{000B}\x{000C}\x{000E}-\x{001F}]/' prompts/*.txt; then
            echo "OK — no invisible Unicode in prompts/"
          else
            echo "ERROR — invisible Unicode detected in a prompt file"
            exit 1
          fi
      - run: npm test -- --ci --coverage
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
