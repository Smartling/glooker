version: '3.8'

services:
  app:
    build: .
    ports:
      # Loopback only. Publishing on all interfaces put an app whose auth was
      # off by default (see AUTH_ENABLED below) on the host's network.
      - "127.0.0.1:3000:3000"
    environment:
      # Database — use MySQL from the mysql service
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-glooker}

      # GitHub
      GITHUB_TOKEN: ${GITHUB_TOKEN}

      # LLM Provider: openai, anthropic, smartling, or openai-compatible
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-5}

      # Smartling (only needed if LLM_PROVIDER=smartling)
      SMARTLING_BASE_URL: ${SMARTLING_BASE_URL:-}
      SMARTLING_ACCOUNT_UID: ${SMARTLING_ACCOUNT_UID:-}
      SMARTLING_USER_IDENTIFIER: ${SMARTLING_USER_IDENTIFIER:-}
      SMARTLING_USER_SECRET: ${SMARTLING_USER_SECRET:-}

      # Jira (optional)
      JIRA_ENABLED: ${JIRA_ENABLED:-}
      JIRA_HOST: ${JIRA_HOST:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_API_VERSION: ${JIRA_API_VERSION:-3}
      JIRA_PROJECTS: ${JIRA_PROJECTS:-}
      JIRA_STORY_POINTS_FIELDS: ${JIRA_STORY_POINTS_FIELDS:-}
      JIRA_PROJECTS_JQL: ${JIRA_PROJECTS_JQL:-}

      # Auth (optional — for ALB OIDC deployments)
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      AUTH_HEADER: ${AUTH_HEADER:-x-amzn-oidc-data}
      AUTH_ADMIN_GROUP: ${AUTH_ADMIN_GROUP:-}
      # Exactly one of these is required whenever AUTH_ENABLED=true — they are
      # how the identity token's signature gets verified. Without one, every
      # request is denied rather than trusted.
      AUTH_ALB_REGION: ${AUTH_ALB_REGION:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_EXPECTED_ISS: ${AUTH_EXPECTED_ISS:-}
      # AUTH_TEST_USER / AUTH_TEST_EMAIL are deliberately NOT passed through.
      # This image runs NODE_ENV=production, where that bypass is now inert by
      # construction; wiring it here is what made a full authentication bypass
      # a copy-paste away for anyone using this file as a deployment template.

      # Anthropic Analytics API (Claude usage cost ingestion)
      ANTHROPIC_ANALYTICS_API_KEY: ${ANTHROPIC_ANALYTICS_API_KEY:-}
      CC_ANALYTICS_PROVIDER: ${CC_ANALYTICS_PROVIDER:-}

      # Vulnerability tracking (optional — GLOOK-43). Off unless VULNERABILITIES_ORG is set.
      # Empty values fall back to the module's neutral defaults; real policy and taxonomy
      # values belong only in the deployment's .env, never in this repo.
      VULNERABILITIES_ORG: ${VULNERABILITIES_ORG:-}
      VULN_SYNC_CRON: ${VULN_SYNC_CRON:-}
      VULN_SYNC_TZ: ${VULN_SYNC_TZ:-}
      VULNERABILITIES_SLA_POLICY: ${VULNERABILITIES_SLA_POLICY:-}
      VULN_RESOLVED_SINCE: ${VULN_RESOLVED_SINCE:-}
      VULN_TEAM_PROPERTY: ${VULN_TEAM_PROPERTY:-}
      VULN_TIER_PROPERTY: ${VULN_TIER_PROPERTY:-}
      VULN_TIER_IN_SCOPE: ${VULN_TIER_IN_SCOPE:-}
      VULN_CODEBASE_PROPERTY: ${VULN_CODEBASE_PROPERTY:-}
      VULN_CODEBASE_GROUPS: ${VULN_CODEBASE_GROUPS:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-glooker}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    # No `ports:` — the app reaches MySQL over the compose network. Publishing
    # 3307 exposed a database whose credentials were hardcoded in this file.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
